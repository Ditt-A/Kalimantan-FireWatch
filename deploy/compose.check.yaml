# Isolated local smoke-test stack. No scheduled provider acquisition is started.
services:
  api:
    image: firewatch-api:local
    pull_policy: never
  web:
    image: firewatch-web:local
    pull_policy: never
  worker:
    image: firewatch-api:local
    pull_policy: never
    profiles: ["scheduled"]
  proxy:
    ports: !override
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
