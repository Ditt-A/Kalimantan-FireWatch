[project]
name = "kalimantan-firewatch"
version = "0.1.0"
description = "Spatio-temporal hotspot monitoring and prediction for Kalimantan"
requires-python = ">=3.10"
dependencies = [
  "altair>=5",
  "catboost>=1.2",
  "cdsapi>=0.7",
  "geopandas>=1.0",
  "fastapi>=0.115",
  "h5py>=3.8",
  "h5netcdf>=1.0",
  "joblib>=1.2",
  "lightgbm>=4.0",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "osmium>=4.2,<5",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "python-docx>=1.1",
  "pyarrow>=12",
  "pydeck>=0.8",
  "rasterio>=1.3",
  "requests>=2.31",
  "scikit-learn>=1.2",
  "streamlit>=1.30",
  "uvicorn>=0.30",
  "xarray>=2023.0",
  "xgboost>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
